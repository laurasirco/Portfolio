<!DOCTYPE html>
<html>

<head>
    <title>{{page.title}}</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="/assets/css/app.css">
    <link rel="shortcut icon" type="image/png" href="/assets/img/favicon.png">

    <!-- Smooth scroll CSS -->
    <style>
        html {
            scroll-behavior: smooth;
        }
        
        /* ScrollSmoother wrapper needs the padding, not body */
        #smooth-wrapper {
            padding-top: 120px;
        }
        
        @media (max-width: 768px) {
            #smooth-wrapper {
                padding-top: 100px;
            }
        }
        
        @media (max-width: 480px) {
            #smooth-wrapper {
                padding-top: 90px;
            }
        }
        
        @media (max-width: 360px) {
            #smooth-wrapper {
                padding-top: 80px;
            }
        }

        #smooth-content {
            min-height: calc(100vh - 120px);
            padding-bottom: 110px;
        }

        @media (max-width: 768px) {
            #smooth-content {
                min-height: calc(100vh - 100px);
                padding-bottom: 100px;
            }
        }

        @media (max-width: 480px) {
            #smooth-content {
                min-height: calc(100vh - 90px);
                padding-bottom: 90px;
            }
        }

        @media (max-width: 360px) {
            #smooth-content {
                min-height: calc(100vh - 80px);
                padding-bottom: 80px;
            }
        }
    </style>

    <!-- GSAP Animation Library -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollSmoother.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/SplitText.min.js"></script>

    {% if page.bg_color or page.text_color %}
    <style>
        :root {
            {% if page.bg_color %}--bg-color: {{ page.bg_color }};{% endif %}
            {% if page.text_color %}--text-color: {{ page.text_color }};{% endif %}
        }
    </style>
    {% endif %}

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-J4X8JB2GCJ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-J4X8JB2GCJ');
    </script>
</head>

<body>
    <!-- position: fixed elements can go outside -->
    {% include header.html %}
    {% include footer.html %}
    
    <div id="smooth-wrapper">
        <div id="smooth-content">
            <section>
                {{ content }}
            </section>
        </div>
    </div>
    
    <script src="/assets/js/logo.js"></script>
    <script src="/assets/js/slideshow.js"></script>
    <script src="/assets/js/scroll-animations.js"></script>
    <script src="/assets/js/welcome-text-animation.js"></script>
    <script src="/assets/js/header-scroll-shrink.js"></script>
    <script src="/assets/js/header-mobile-menu.js"></script>
    <script src="/assets/js/header-theme.js"></script>
    <script src="/assets/js/header-footer-colors.js"></script>
    <script src="/assets/js/external-links.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tone@15.1.22/build/Tone.min.js"></script>
    <script src="/assets/js/interaction-sfx.js?v=20260319-7"></script>
    <script src="/assets/js/header-audio-toggle.js"></script>
    <script src="/assets/js/sticker-randomized-position.js"></script>
    <script src="/assets/js/systems/touch-scroll-lock.js"></script>
    <script src="/assets/js/sticker-drag.js"></script>
    <script src="/assets/js/about-sticker-bounce.js"></script>
    <script src="/assets/js/sticker-collision-system.js"></script>
</body>

</html>
