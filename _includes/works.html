{% assign works = site.works | sort: "year" | reverse %}

<div class="container-fluid header_margin footer_padding works-masonry">
    {% for work in works %}
        <div class="work_grid">
            <a href="{{work.url}}">
            <img class="img-fluid" src={{ work.thumb }} alt="{{ work.title }}">
            <h1>{{work.title}}</h1>
            </a>
        </div>
    {% endfor %}
</div>
