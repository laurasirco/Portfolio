<div class="discipline-filter is-hidden" aria-hidden="true">
    <a href="/sketchbook/" class="filter-link active" data-filter="all">All</a>
    {% assign disciplines = site.playground | map: "discipline" | uniq | sort %}
    {% for discipline in disciplines %}
        {% if discipline %}
        <a href="/sketchbook/?filter={{discipline}}" class="filter-link" data-filter="{{discipline}}">{{discipline}}</a>
        {% endif %}
    {% endfor %}
</div>
